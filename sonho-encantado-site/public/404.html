<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página não encontrada | Centro Educacional Sonho Encantado</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --green: #075f36;
        --dark: #123b2b;
        --paper: #f8f7f0;
        --yellow: #edc84b;
        --ink: #1e3028;
        --muted: #3b5046;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background-color: var(--paper);
        color: var(--ink);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        line-height: 1.6;
      }
      main {
        width: 100%;
        max-width: 34rem;
        background: #ffffff;
        border: 1px solid rgba(18, 59, 43, 0.14);
        border-top: 4px solid var(--green);
        border-radius: 1rem;
        padding: 2rem;
        box-shadow: 0 14px 36px -18px rgba(18, 59, 43, 0.16);
      }
      .eyebrow {
        margin: 0;
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--green);
      }
      h1 {
        margin: 0.65rem 0 0;
        font-size: clamp(1.6rem, 4vw, 2.1rem);
        line-height: 1.15;
        color: var(--dark);
      }
      p {
        margin: 0.9rem 0 0;
        color: var(--muted);
        font-size: 1rem;
      }
      .actions {
        margin-top: 1.5rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      a.primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0.65rem 1.4rem;
        border-radius: 999px;
        background-color: var(--green);
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }
      a.primary:hover {
        background-color: var(--dark);
      }
      a.secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0.65rem 1.25rem;
        border-radius: 999px;
        border: 1px solid rgba(18, 59, 43, 0.25);
        color: var(--dark);
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid var(--yellow);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Erro 404 · Centro Educacional Sonho Encantado</p>
      <h1>Esta página não foi encontrada.</h1>
      <p>
        O endereço acessado pode ter sido alterado ou não existir. Volte para a página inicial para conhecer nossas etapas de ensino, unidades no Guamá e canais da secretaria.
      </p>
      <div class="actions">
        <a class="primary" href="/">Voltar para a página inicial</a>
        <a class="secondary" href="https://wa.me/5591998248944" target="_blank" rel="noopener noreferrer">
          Falar no WhatsApp
        </a>
      </div>
    </main>
  </body>
</html>
